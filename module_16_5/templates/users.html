{% extends 'main.html'%}
{% block crud_container %}
<section class="container-fluid">
    <form method="post" action="/">
        <div class="col-auto">
            <div class="input-group mb-3">
                <input type="text" class="form-control" name="username" placeholder="Введите имя"/>
                <input type="text" class="form-control" name="age" placeholder="Введите возраст"/>
                <button type="submit" value="Добавить" class="btn btn-primary">Добавить</button>
            </div>
        </div>
    </form>
</section>
    {% if user %}
        <article class="card container fluid"></article>
        <br>
        <!-- Напишите свой код здесь (Вывод свойств объекта User) -->
            <h1>ID: {{ user.id }}</h1>
            <p>Name: {{ user.username }}</p>
            <p>Age: {{ user.age }}</p>
            <a href="/">на главную</a>
    {% else %}
            <section class="container-fluid">
                <h2 align="center"> Users </h2>
                <br>
                <div class="card">
                    <ul class="list-group list-group-flush">
                        <!-- Напишите свой код здесь (перебор пользователей) -->
                        {% for user in users %}
                        <li class="list-group-item">
                            <a href="/user/{{ user.id }}">{{ user.id }}. {{ user.username }}</a>
                        </li>
                        {% endfor %}
                    </ul>
                </div>
            </section>
    {% endif %}
{% endblock %}
